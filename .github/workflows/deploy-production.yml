name: Deploy production (Vercel, legacy/alternative)

# LEGACY/ALTERNATIVE path, kept working but no longer the primary
# production target as of the AWS-first pivot (PR #26 review comment
# 5750338323) -- see .github/workflows/deploy-production-aws.yml for the
# primary path and DEPLOYMENT.md for why. This workflow is unchanged
# otherwise and still deploys correctly if the owner chooses this path
# instead of (or in addition to, for a staging comparison) AWS.
#
# Builds and deploys the full Next.js app (server runtime -- the RFQ API
# route needs Node execution, not static export) to Vercel. Requires three
# repo secrets the OWNER must add before this does anything:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (see DEPLOYMENT.md for exactly how to get them). Until those secrets
# exist, this workflow's steps intentionally no-op instead of failing
# loudly on every push to main -- nothing here calls `vercel deploy`
# without the owner's own Vercel project/credentials in place. This repo's
# session did NOT create a live Vercel project or run a deploy (see PR
# description) -- provisioning that project and adding these secrets is
# the explicit external/human step this workflow is waiting for.

# DISABLED as an automatic deploy: AWS (deploy-production-aws.yml) is the
# production path, and two production targets deploying the same commit
# would split RFQ data between backends. Kept runnable by hand only
# (Actions -> "Deploy production (Vercel, legacy/alternative)" -> Run
# workflow) for a deliberate comparison/fallback.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping production deploy: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set yet. See DEPLOYMENT.md."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.check.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel (prebuilt)
        if: steps.check.outputs.ready == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output to Vercel production
        if: steps.check.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
